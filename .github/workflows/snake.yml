name: Generate Snake Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 午夜
  workflow_dispatch:  # 手动触发

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: SuperMarioYL
          outputs: |
            profile-snake-contrib/github-contribution-grid-snake-dark.svg?palette=github-dark
            profile-snake-contrib/github-contribution-grid-snake.svg?palette=github-light

      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          add: 'profile-snake-contrib/*.svg'
          message: 'Update snake contribution graph'
          default_author: github_actions
