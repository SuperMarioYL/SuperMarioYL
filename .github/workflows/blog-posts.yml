name: Latest Blog Posts

on:
  # schedule:
  #   - cron: '0 0 * * *'  # 每日 00:00 UTC 更新 (临时禁用 - SSL证书过期)
  workflow_dispatch:  # 手动触发

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.lei6393.com/rss.xml,https://www.lei6393.com/feed.xml,https://www.lei6393.com/atom.xml"
          max_post_count: 5
          template: "- [$title]($url) · $publishedDate"
          date_format: "mmm dd, yyyy"
          commit_message: "Update blog posts"
          committer_username: "github-actions[bot]"
          committer_email: "github-actions[bot]@users.noreply.github.com"
