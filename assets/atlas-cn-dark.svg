    <g fill="none" stroke="#9CC9FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(356,303)"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="1.8"/><path d="M8 2v4.2M8 9.8V14M2 8h4.2M9.8 8H14"/></g>
      <g transform="translate(528,303)"><rect x="3.2" y="3.2" width="9.6" height="9.6" rx="1.5"/><rect x="6.2" y="6.2" width="3.6" height="3.6"/><path d="M5.5 3.2V1.4M10.5 3.2V1.4M5.5 14.6V12.8M10.5 14.6V12.8M3.2 5.5H1.4M3.2 10.5H1.4M12.8 5.5H14.6M12.8 10.5H14.6"/></g>
