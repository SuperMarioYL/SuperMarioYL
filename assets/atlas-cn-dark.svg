  <text class="az-e az-e3" x="516" y="136" text-anchor="middle" font-size="11" fill="#9A9AA0">模式校验调用</text>

  <rect class="az-e az-e4" x="430" y="186" width="172" height="58" rx="14" fill="#8985FF" fill-opacity="0.14" stroke="#8985FF" stroke-width="1.5"/>
  <text class="az-e az-e4" x="516" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#B7B4FF">记忆 + RAG</text>
  <text class="az-e az-e4" x="516" y="230" text-anchor="middle" font-size="11" fill="#9A9AA0">向量库 · GraphRAG</text>

  <rect class="az-e az-e5" x="648" y="140" width="200" height="58" rx="14" fill="#2DC79A" fill-opacity="0.14" stroke="#2DC79A" stroke-width="1.5"/>
  <text class="az-e az-e5" x="748" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#86E3C6">推理</text>
  <text class="az-e az-e5" x="748" y="184" text-anchor="middle" font-size="11" fill="#9A9AA0">vLLM · KV-cache · 批处理</text>

  <g class="az-e az-e6">
    <rect x="184" y="284" width="664" height="54" rx="16" fill="#4DA3FF" fill-opacity="0.14" stroke="#4DA3FF" stroke-width="1.5"/>
