    <line x1="384" y1="158" x2="426" y2="128" marker-end="url(#ah-cd)"/>
    <line x1="384" y1="208" x2="426" y2="218" marker-end="url(#ah-cd)"/>
    <line x1="602" y1="124" x2="644" y2="158" marker-end="url(#ah-cd)"/>
