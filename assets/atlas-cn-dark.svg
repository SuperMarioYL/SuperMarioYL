<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Inter, -apple-system, sans-serif" role="img" aria-label="智能体平台架构：用户到编排器到工具与记忆再到推理，运行在云原生底座上；追踪汇入评测与可观测，反馈闭环回到编排器，护栏把关动作">
  <defs>
    <marker id="ah-cd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/></marker>
    <marker id="af-cd" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#4A4A55"/></marker>
  </defs>
  <style>
    .az-e { animation: az-enter 0.55s cubic-bezier(0.4,0,0.2,1) backwards; transform-box: fill-box; transform-origin: center; }
    .az-e2 { animation-delay: 0.08s; }
    .az-e3 { animation-delay: 0.16s; }
    .az-e4 { animation-delay: 0.24s; }
    .az-e5 { animation-delay: 0.32s; }
    .az-e6 { animation-delay: 0.4s; }
    .az-e7 { animation-delay: 0.48s; }
    .az-e7m { animation: az-enter 0.55s cubic-bezier(0.4,0,0.2,1) 0.48s backwards, az-march9 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes az-enter { from { opacity: 0; transform: translateY(4px); } }
    .az-p { animation: az-pulse 2.6s linear infinite; }
    .az-p1 { animation-delay: 0.6s; }
    .az-p2 { animation-delay: 1.5s; }
    .az-p3 { animation-delay: 1.65s; }
    .az-p4 { animation-delay: 2.4s; }
    .az-p5 { animation-delay: 2.55s; }
    .az-p6 { animation-delay: 3.3s; }
    @keyframes az-pulse { from { stroke-dashoffset: 118; } to { stroke-dashoffset: 12; } }
    .az-m8 { animation: az-march8 1.6s linear infinite; }
    @keyframes az-march8 { from { stroke-dashoffset: 8; } to { stroke-dashoffset: 0; } }
    @keyframes az-march9 { from { stroke-dashoffset: 9; } to { stroke-dashoffset: 0; } }
    .az-c { animation: az-breathe 9s ease-in-out infinite; }
    @keyframes az-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <circle class="az-c" cx="300" cy="180" r="140" fill="none" stroke="#4DA3FF" stroke-opacity="0.07" stroke-width="1.5"/>

