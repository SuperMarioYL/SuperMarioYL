    <circle cx="40" cy="48" r="20" fill="none" stroke="#4DA3FF" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="34" cy="51" r="7" fill="#4DA3FF"/><circle cx="46" cy="51" r="9" fill="#4DA3FF"/><circle cx="40" cy="44" r="8" fill="#4DA3FF"/><rect x="27" y="48" width="26" height="8" rx="4" fill="#4DA3FF"/>
    <text x="18" y="90" font-size="17" font-weight="600" fill="#F5F5F7">Cloud Native AI</text>
    <text x="18" y="108" font-size="12" fill="#8E8E93">云原生 AI</text>
    <rect x="18" y="118" width="28" height="3" rx="1.5" fill="#4DA3FF"/>
    <text x="18" y="142" font-size="12" fill="#C7C7CC">Schedule · serve · scale on K8s.</text>
    <rect x="16" y="156" width="240" height="72" rx="10" fill="#15161C" stroke="#2A2A33"/>
    <rect x="92" y="164" width="88" height="20" rx="6" fill="#4DA3FF" fill-opacity="0.18"/><text x="136" y="178" text-anchor="middle" font-size="10" fill="#9CC9FF">scheduler</text>
    <line x1="136" y1="184" x2="60" y2="200" stroke="#3E5878" stroke-width="1"/><line x1="136" y1="184" x2="136" y2="200" stroke="#3E5878" stroke-width="1"/><line x1="136" y1="184" x2="212" y2="200" stroke="#3E5878" stroke-width="1"/>
    <rect x="44" y="200" width="34" height="22" rx="6" fill="#4DA3FF" fill-opacity="0.20"/><text x="61" y="215" text-anchor="middle" font-size="9" fill="#9CC9FF">pod</text>
    <rect x="119" y="200" width="34" height="22" rx="6" fill="#4DA3FF" fill-opacity="0.20"/><text x="136" y="215" text-anchor="middle" font-size="9" fill="#9CC9FF">pod</text>
    <rect x="195" y="200" width="34" height="22" rx="6" fill="#4DA3FF" fill-opacity="0.20"/><text x="212" y="215" text-anchor="middle" font-size="9" fill="#9CC9FF">pod</text>
    <rect x="18" y="248" width="46" height="22" rx="11" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-opacity="0.40"/><text x="41" y="263" text-anchor="middle" font-size="11" fill="#9CC9FF">K8s</text>
    <rect x="72" y="248" width="48" height="22" rx="11" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-opacity="0.40"/><text x="96" y="263" text-anchor="middle" font-size="11" fill="#9CC9FF">GPU</text>
    <rect x="128" y="248" width="74" height="22" rx="11" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-opacity="0.40"/><text x="165" y="263" text-anchor="middle" font-size="11" fill="#9CC9FF">serving</text>
  </g>

  <!-- Card 3 · Inference -->
  <g transform="translate(598,10)">
    <rect width="272" height="280" rx="16" fill="#1E1E25" stroke="#2A2A33"/>
    <circle cx="40" cy="48" r="20" fill="none" stroke="#2DC79A" stroke-opacity="0.35" stroke-width="1.5"/>
    <polygon points="44,36 30,53 39,53 36,62 50,45 41,45" fill="#2DC79A"/>
    <text x="18" y="90" font-size="17" font-weight="600" fill="#F5F5F7">Inference</text>
    <text x="18" y="108" font-size="12" fill="#8E8E93">推理加速</text>
    <rect x="18" y="118" width="28" height="3" rx="1.5" fill="#2DC79A"/>
    <text x="18" y="142" font-size="12" fill="#C7C7CC">Cut latency &amp; cost at serving.</text>
    <rect x="16" y="156" width="240" height="72" rx="10" fill="#15161C" stroke="#2A2A33"/>
    <text x="30" y="180" font-size="10" fill="#8E8E93">latency</text>
    <rect x="92" y="172" width="40" height="9" rx="4" fill="#2DC79A" fill-opacity="0.50"/>
    <text x="150" y="180" font-size="11" fill="#86E3C6">▼ lower</text>
    <text x="30" y="208" font-size="10" fill="#8E8E93">throughput</text>
    <rect x="110" y="200" width="104" height="9" rx="4" fill="#2DC79A"/>
    <text x="222" y="208" font-size="11" fill="#86E3C6" text-anchor="end">▲</text>
    <rect x="18" y="248" width="52" height="22" rx="11" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-opacity="0.40"/><text x="44" y="263" text-anchor="middle" font-size="11" fill="#86E3C6">vLLM</text>
    <rect x="78" y="248" width="84" height="22" rx="11" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-opacity="0.40"/><text x="120" y="263" text-anchor="middle" font-size="11" fill="#86E3C6">KV-cache</text>
    <rect x="170" y="248" width="60" height="22" rx="11" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-opacity="0.40"/><text x="200" y="263" text-anchor="middle" font-size="11" fill="#86E3C6">quant</text>
  </g>
</svg>
