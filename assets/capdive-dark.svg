    <path d="M196,180 C196,166 70,166 56,180" fill="none" stroke="#8E8E93" stroke-width="1.2" marker-end="url(#cdd-a)"/>
    <rect x="30" y="186" width="46" height="22" rx="11" fill="#8985FF" fill-opacity="0.18"/><text x="53" y="201" text-anchor="middle" font-size="11" fill="#B7B4FF">plan</text>
    <line x1="78" y1="197" x2="92" y2="197" stroke="#8E8E93" stroke-width="1.2" marker-end="url(#cdd-a)"/>
    <rect x="96" y="186" width="42" height="22" rx="11" fill="#8985FF" fill-opacity="0.18"/><text x="117" y="201" text-anchor="middle" font-size="11" fill="#B7B4FF">act</text>
    <line x1="140" y1="197" x2="154" y2="197" stroke="#8E8E93" stroke-width="1.2" marker-end="url(#cdd-a)"/>
    <rect x="158" y="186" width="64" height="22" rx="11" fill="#8985FF" fill-opacity="0.18"/><text x="190" y="201" text-anchor="middle" font-size="11" fill="#B7B4FF">reflect</text>
    <rect x="18" y="248" width="44" height="22" rx="11" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-opacity="0.40"/><text x="40" y="263" text-anchor="middle" font-size="11" fill="#B7B4FF">MCP</text>
    <rect x="70" y="248" width="44" height="22" rx="11" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-opacity="0.40"/><text x="92" y="263" text-anchor="middle" font-size="11" fill="#B7B4FF">RAG</text>
    <rect x="122" y="248" width="48" height="22" rx="11" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-opacity="0.40"/><text x="146" y="263" text-anchor="middle" font-size="11" fill="#B7B4FF">eval</text>
