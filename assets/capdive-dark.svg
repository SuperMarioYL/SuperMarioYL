<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Capability deep-dive: AI Agent loop, Cloud Native topology, Inference latency and throughput">
  <defs>
    <marker id="cdd-a" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#8E8E93"/></marker>
  </defs>

  <!-- Card 1 · AI Agent -->
  <g transform="translate(10,10)">
    <rect width="272" height="280" rx="16" fill="#1E1E25" stroke="#2A2A33"/>
    <circle cx="40" cy="48" r="20" fill="none" stroke="#8985FF" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="29" y="42" width="22" height="18" rx="4" fill="none" stroke="#8985FF" stroke-width="1.6"/>
    <circle cx="36" cy="51" r="1.8" fill="#8985FF"/><circle cx="44" cy="51" r="1.8" fill="#8985FF"/>
    <line x1="40" y1="42" x2="40" y2="36" stroke="#8985FF" stroke-width="1.6"/><circle cx="40" cy="35" r="1.7" fill="#8985FF"/>
    <text x="18" y="90" font-size="17" font-weight="600" fill="#F5F5F7">AI Agent</text>
