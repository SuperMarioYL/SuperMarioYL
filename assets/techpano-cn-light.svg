<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 216" width="880" height="216" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Inter, -apple-system, sans-serif" role="img" aria-label="按支柱分组的技术栈">
  <style>
    .tp-row { transform-box: fill-box; transform-origin: center; animation: tp-in 0.7s cubic-bezier(0.4,0,0.2,1) backwards; }
    .tp-r2 { animation-delay: 0.15s; }
    .tp-r3 { animation-delay: 0.3s; }
    .tp-dot { transform-box: fill-box; transform-origin: center; animation: tp-pulse 3.2s ease-in-out infinite; }
    .tp-d2 { animation-delay: 0.5s; }
    .tp-d3 { animation-delay: 1s; }
    @keyframes tp-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes tp-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.72; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <!-- Agent row -->
  <g class="tp-row">
  <rect x="8" y="32" width="2" height="28" rx="1" fill="#5E5CE6" opacity="0.5"/>
  <circle class="tp-dot" cx="24" cy="46" r="5" fill="#5E5CE6"/>
  <text x="38" y="50" font-size="13" font-weight="600" fill="#1D1D1F">AI 智能体</text>
  <g font-size="11" font-weight="500" fill="#4B3FC4">
    <rect x="180" y="34" width="56" height="24" rx="12" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-opacity="0.35"/><text x="208" y="50" text-anchor="middle">Skills</text>
    <rect x="244" y="34" width="56" height="24" rx="12" fill="#5E5CE6" fill-opacity="0.18" stroke="#5E5CE6" stroke-opacity="0.6"/><circle cx="253" cy="46" r="2" fill="#5E5CE6"/><text x="274" y="50" text-anchor="middle">MCP</text>
    <rect x="308" y="34" width="82" height="24" rx="12" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-opacity="0.35"/><text x="349" y="50" text-anchor="middle">LlamaIndex</text>
    <rect x="398" y="34" width="64" height="24" rx="12" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-opacity="0.35"/><text x="430" y="50" text-anchor="middle">Milvus</text>
  </g>
  </g>
  <!-- Cloud row -->
  <g class="tp-row tp-r2">
  <rect x="8" y="92" width="2" height="28" rx="1" fill="#0071E3" opacity="0.5"/>
  <circle class="tp-dot tp-d2" cx="24" cy="106" r="5" fill="#0071E3"/>
  <text x="38" y="110" font-size="13" font-weight="600" fill="#1D1D1F">云原生 AI</text>
  <g font-size="11" font-weight="500" fill="#0A4F9E">
    <rect x="180" y="94" width="98" height="24" rx="12" fill="#0071E3" fill-opacity="0.18" stroke="#0071E3" stroke-opacity="0.6"/><circle cx="189" cy="106" r="2" fill="#0071E3"/><text x="234" y="110" text-anchor="middle">Kubernetes</text>
    <rect x="286" y="94" width="64" height="24" rx="12" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-opacity="0.35"/><text x="318" y="110" text-anchor="middle">Volcano</text>
    <rect x="358" y="94" width="68" height="24" rx="12" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-opacity="0.35"/><text x="392" y="110" text-anchor="middle">Kubeflow</text>
    <rect x="434" y="94" width="92" height="24" rx="12" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-opacity="0.35"/><text x="480" y="110" text-anchor="middle">KubeRay/Ray</text>
    <rect x="534" y="94" width="52" height="24" rx="12" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-opacity="0.35"/><text x="560" y="110" text-anchor="middle">KEDA</text>
    <rect x="594" y="94" width="62" height="24" rx="12" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-opacity="0.35"/><text x="625" y="110" text-anchor="middle">KServe</text>
  </g>
  </g>
  <!-- Inference -->
  <g class="tp-row tp-r3">
  <rect x="8" y="156" width="2" height="28" rx="1" fill="#10A37F" opacity="0.5"/>
  <circle class="tp-dot tp-d3" cx="24" cy="170" r="5" fill="#10A37F"/>
  <text x="38" y="174" font-size="13" font-weight="600" fill="#1D1D1F">推理加速</text>
  <g font-size="11" font-weight="500" fill="#0B6B53">
    <rect x="180" y="144" width="64" height="24" rx="12" fill="#10A37F" fill-opacity="0.18" stroke="#10A37F" stroke-opacity="0.6"/><circle cx="189" cy="156" r="2" fill="#10A37F"/><text x="213" y="160" text-anchor="middle">vLLM</text>
    <rect x="252" y="144" width="64" height="24" rx="12" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-opacity="0.35"/><text x="284" y="160" text-anchor="middle">SGLang</text>
    <rect x="324" y="144" width="108" height="24" rx="12" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-opacity="0.35"/><text x="378" y="160" text-anchor="middle">PagedAttention</text>
    <rect x="440" y="144" width="132" height="24" rx="12" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-opacity="0.35"/><text x="506" y="160" text-anchor="middle">continuous batching</text>
    <rect x="580" y="144" width="138" height="24" rx="12" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-opacity="0.35"/><text x="649" y="160" text-anchor="middle">speculative decoding</text>
    <rect x="726" y="144" width="108" height="24" rx="12" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-opacity="0.35"/><text x="780" y="160" text-anchor="middle">FlashAttention</text>

    <rect x="180" y="176" width="104" height="24" rx="12" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-opacity="0.35"/><text x="232" y="192" text-anchor="middle">chunked prefill</text>
    <rect x="292" y="176" width="98" height="24" rx="12" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-opacity="0.35"/><text x="341" y="192" text-anchor="middle">prefix caching</text>
    <rect x="398" y="176" width="82" height="24" rx="12" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-opacity="0.35"/><text x="439" y="192" text-anchor="middle">KV-cache</text>
    <rect x="488" y="176" width="116" height="24" rx="12" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-opacity="0.35"/><text x="546" y="192" text-anchor="middle">量化 FP8/AWQ</text>
    <rect x="612" y="176" width="92" height="24" rx="12" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-opacity="0.35"/><text x="658" y="192" text-anchor="middle">TP/PP 并行</text>
    <rect x="712" y="176" width="96" height="24" rx="12" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-opacity="0.35"/><text x="760" y="192" text-anchor="middle">LoRA serving</text>
  </g>
  </g>
</svg>
