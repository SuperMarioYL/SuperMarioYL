<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="880" height="140" role="img" aria-label="Let's build reliable AI systems together">
  <style>
    .ft-ring { animation: ft-breathe 8s ease-in-out infinite; }
    .ft-ring2 { animation-delay: 1.5s; }
    @keyframes ft-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    .ft-dot { transform-box: fill-box; transform-origin: center; animation: ft-wave 2.6s ease-in-out infinite; }
    .ft-dot2 { animation-delay: 0.25s; }
    .ft-dot3 { animation-delay: 0.5s; }
    @keyframes ft-wave { 0%, 26%, 100% { transform: scale(1); } 13% { transform: scale(1.2); } }
    .ft-line { transform-box: fill-box; transform-origin: center; animation: ft-rise 0.7s cubic-bezier(0.4, 0, 0.2, 1) backwards; }
    .ft-line1 { animation-delay: 0.1s; }
    .ft-line2 { animation-delay: 0.25s; }
    @keyframes ft-rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="880" height="140" rx="24" fill="#16161C"/>
  <circle class="ft-ring" cx="440" cy="60" r="52" fill="none" stroke="#4DA3FF" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle class="ft-ring ft-ring2" cx="440" cy="60" r="34" fill="none" stroke="#4DA3FF" stroke-opacity="0.26" stroke-width="1.5"/>
