<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Agent platform: user to orchestrator to tools and memory to inference, on a cloud-native substrate, instrumented by eval and observability">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/></marker>
  </defs>
  <circle cx="300" cy="180" r="140" fill="none" stroke="#0071E3" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="146" y1="180" x2="180" y2="180" marker-end="url(#ah-l)"/>
    <line x1="384" y1="158" x2="426" y2="128" marker-end="url(#ah-l)"/>
    <line x1="384" y1="208" x2="426" y2="218" marker-end="url(#ah-l)"/>
    <line x1="602" y1="124" x2="644" y2="158" marker-end="url(#ah-l)"/>
    <line x1="602" y1="218" x2="644" y2="184" marker-end="url(#ah-l)"/>
    <line x1="748" y1="200" x2="748" y2="282" marker-end="url(#ah-l)"/>
  </g>
  <g stroke="#B9B9C2" stroke-width="1.3" stroke-dasharray="4 4" fill="none">
    <line x1="486" y1="64" x2="320" y2="112"/>
    <line x1="576" y1="64" x2="712" y2="136"/>
  </g>

  <!-- Eval & Observability (cross-cutting) -->
  <rect x="430" y="26" width="200" height="38" rx="12" fill="#6E6E73" fill-opacity="0.07" stroke="#B9B9C2" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="530" y="50" text-anchor="middle" font-size="12" font-weight="500" fill="#5A5A60">Eval &amp; Observability</text>

  <!-- User -->
  <rect x="26" y="150" width="120" height="60" rx="14" fill="#6E6E73" fill-opacity="0.07" stroke="#B0B0B5" stroke-width="1"/>
  <text x="86" y="186" text-anchor="middle" font-size="14" font-weight="500" fill="#424245">User / Task</text>

  <!-- Orchestrator -->
  <rect x="184" y="112" width="200" height="132" rx="16" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5"/>
  <text x="284" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">Orchestrator</text>
  <text x="284" y="166" text-anchor="middle" font-size="11" fill="#6E6E73">planner · critic · reflection</text>
  <rect x="200" y="184" width="78" height="26" rx="13" fill="#5E5CE6" fill-opacity="0.14" stroke="#5E5CE6" stroke-opacity="0.4"/><text x="239" y="201" text-anchor="middle" font-size="11" fill="#4B3FC4">Planner</text>
  <rect x="288" y="184" width="84" height="26" rx="13" fill="#5E5CE6" fill-opacity="0.14" stroke="#5E5CE6" stroke-opacity="0.4"/><text x="330" y="201" text-anchor="middle" font-size="11" fill="#4B3FC4">Critic loop</text>

  <!-- Tools / MCP -->
  <rect x="430" y="92" width="172" height="58" rx="14" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5"/>
  <text x="516" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Tools / MCP</text>
  <text x="516" y="136" text-anchor="middle" font-size="11" fill="#6E6E73">schema-validated calls</text>

  <!-- Memory + RAG -->
  <rect x="430" y="186" width="172" height="58" rx="14" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5"/>
  <text x="516" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Memory + RAG</text>
  <text x="516" y="230" text-anchor="middle" font-size="11" fill="#6E6E73">vector DB · GraphRAG</text>

  <!-- Inference -->
  <rect x="648" y="140" width="200" height="58" rx="14" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5"/>
  <text x="748" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">Inference</text>
  <text x="748" y="184" text-anchor="middle" font-size="11" fill="#6E6E73">vLLM · KV-cache · batching</text>

  <!-- Cloud Native substrate -->
  <rect x="184" y="284" width="664" height="54" rx="16" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
  <text x="516" y="316" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">Cloud Native AI  —  Kubernetes · GPU scheduling · multi-tenant serving</text>
</svg>
